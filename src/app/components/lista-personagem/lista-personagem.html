<section class="grid">
  @for (personagem of personagens(); track personagem.id) {
    <app-card-personagem
      [nome]="personagem.nome"
      [imagem]="personagem.imagem"
      [totalVotos]="personagem.votos"
      [personagemId]="personagem.id"
      (votou)="incrementarVoto($event)">
    </app-card-personagem>
  }
</section>
